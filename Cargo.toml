[package]
name = "churncode"
version = "0.1.0"
edition = "2024"
description = "Per-commit code churn of a git branch, from forward line tracking"
license = "Apache-2.0"
repository = "https://github.com/sjawhar/churncode"
readme = "README.md"
keywords = ["git", "churn", "metrics", "blame"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
